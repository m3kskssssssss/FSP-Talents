name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fsp
          POSTGRES_PASSWORD: fsp
          POSTGRES_DB: fsp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fsp" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://fsp:fsp@localhost:5432/fsp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start stack
        run: docker compose up -d --build --wait app
      - name: Seed
        run: docker compose --profile seed run --rm seed
      - run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:3000
      - if: failure()
        run: docker compose logs app | tail -200
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
