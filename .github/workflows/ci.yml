name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fsp
          POSTGRES_PASSWORD: fsp
          POSTGRES_DB: fsp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fsp -d fsp_test" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://fsp:fsp@localhost:5432/fsp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start stack
        run: docker compose up -d --build --wait app
      - name: Seed
        run: docker compose --profile seed run --rm seed
      - run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          # The e2e "strong candidate" reads item seeds from the compose database.
          E2E_DATABASE_URL: postgres://fsp:fsp@localhost:5432/fsp
      - if: failure()
        run: docker compose logs app | tail -200
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  # Production deploy through the Vercel CLI. Git-triggered deploys are blocked
  # on the Hobby plan for commit authors who are not members of the Vercel
  # project; a CLI deploy is made on behalf of the token owner instead.
  # Needs repository secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID;
  # without them the job is skipped. Runs only after check and e2e passed.
  deploy:
    runs-on: ubuntu-latest
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: { group: production-deploy, cancel-in-progress: false }
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Vercel secrets are not set, deploy skipped"; fi
      - name: Deploy to production (built on Vercel with the project's env)
        if: steps.secrets.outputs.ok == 'true'
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
