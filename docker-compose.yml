# One-command local stack: `docker compose up --build`
#   app      http://localhost:3000
#   mailpit  http://localhost:8025 (all outgoing mail)
#   keycloak http://localhost:8080 (only with `--profile keycloak`)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fsp
      POSTGRES_PASSWORD: fsp
      POSTGRES_DB: fsp
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsp"]
      interval: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://fsp:fsp@db:5432/fsp
      APP_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:-local-dev-secret-please-change-0123456789abcdef}
      AUTH_TRUST_HOST: "true"
      DEMO_MODE: ${DEMO_MODE:-true}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      STORAGE_DIR: /app/storage
      LLM_BASE_URL: ${LLM_BASE_URL:-https://routerai.ru/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-6-luna-pro}
      LLM_MODEL_STRONG: ${LLM_MODEL_STRONG:-openai/gpt-6-luna-pro}
      AUTH_KEYCLOAK_ENABLED: ${AUTH_KEYCLOAK_ENABLED:-false}
      AUTH_KEYCLOAK_ID: fsp-talents
      AUTH_KEYCLOAK_SECRET: fsp-talents-secret
      AUTH_KEYCLOAK_ISSUER: http://localhost:8080/realms/fsp
    volumes: [storage:/app/storage]

  # Fills the database with synthetic data and demo accounts (runs once).
  seed:
    build: .
    profiles: ["seed"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://fsp:fsp@db:5432/fsp
    command: ["sh", "-c", "node node_modules/tsx/dist/cli.mjs scripts/migrate.ts && node node_modules/tsx/dist/cli.mjs scripts/seed.ts"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["keycloak"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes: [./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro]

volumes:
  pgdata:
  storage:
